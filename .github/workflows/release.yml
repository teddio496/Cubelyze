name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to test; does not publish'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$INPUT_VERSION
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Upload manual test artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Cubelyze-${{ steps.version.outputs.value }}-macOS
          path: |
            build/release/Cubelyze-*.dmg
            build/release/Cubelyze-*.zip
            build/release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/release/Cubelyze-${VERSION}-macOS.dmg" \
            "build/release/Cubelyze-${VERSION}-macOS.zip" \
            build/release/SHA256SUMS.txt \
            --title "Cubelyze $VERSION" --verify-tag \
            --notes "This build is ad-hoc signed and not notarized. macOS may require Privacy & Security → Open Anyway after the first launch."
