name: Bug report
description: Report a reproducible problem in Cubelyze
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Cubelyze. Do not attach private solve videos unless you intend to share them publicly.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 14.7
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cubelyze version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or codec details if relevant.
